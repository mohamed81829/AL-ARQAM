name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.alarqam --project-name al_arqam --platforms=android .

      - name: Download Quran text and font
        run: |
          set -e
          Q=6523a9ad3b73bb7e8cb3a9cdf0ea774b8bab3123
          G=06bfe0d62a98375cb09c942fa18e68bd32cff057
          mkdir -p assets/quran assets/fonts
          curl -fsSL --retry 3 -o assets/quran/uthmani.json "https://raw.githubusercontent.com/risan/quran-json/$Q/data/tanzil/uthmani.json"
          curl -fsSL --retry 3 -o assets/quran/chapters.json "https://raw.githubusercontent.com/risan/quran-json/$Q/data/tanzil/chapters.json"
          curl -fsSL --retry 3 -o assets/fonts/AmiriQuran-Regular.ttf "https://raw.githubusercontent.com/google/fonts/$G/ofl/amiriquran/AmiriQuran-Regular.ttf"
          curl -fsSL --retry 3 -o assets/fonts/OFL.txt "https://raw.githubusercontent.com/google/fonts/$G/ofl/amiriquran/OFL.txt"
          echo "adaebb377c60eba1bab6ef652959c7a0b4ccb4d0ca42145945c14ecdbeb4b761  assets/quran/uthmani.json" | sha256sum -c -
          echo "5b18adae945fcb6f9fbb865dd7dc596f89a63607a4e6617ca9e37f7f10d3386b  assets/quran/chapters.json" | sha256sum -c -
          echo "e2a47644762d16bdfb6d33e0d8db8c6ff30beae84150ef5a705316bbd829455c  assets/fonts/AmiriQuran-Regular.ttf" | sha256sum -c -

      - name: Add adhan sounds (optional)
        run: |
          python3 - <<'PY'
          import pathlib, shutil, unicodedata

          names = {
              'ابوالعينين شعيشع': 'sheisha',
              'الاذان المكى': 'makki',
              'البنا': 'banna',
              'الحصرى': 'husary',
              'القدس': 'quds',
              'المدينة': 'madina',
              'المنشاوى': 'minshawi',
              'عبدالباسط': 'abdelbasit',
          }
          names = {unicodedata.normalize('NFC', k): v for k, v in names.items()}
          raw = pathlib.Path('android/app/src/main/res/raw')
          src = pathlib.Path('sounds')
          if src.exists():
              raw.mkdir(parents=True, exist_ok=True)
              for f in sorted(src.rglob('*')):
                  if not f.is_file():
                      continue
                  stem = unicodedata.normalize('NFC', f.stem).strip()
                  key = names.get(stem)
                  if key:
                      shutil.copy(f, raw / ('adhan_' + key + '.mp3'))
                      print('added', key, '<-', f.name)
                  else:
                      print('skipped', f.name)
          PY

      - name: Add location permissions
        run: |
          sed -i '/<manifest/a <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

      - name: Configure Android (permissions, notifications, speech)
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              '''
          intents = '''<intent>
                  <action android:name="android.speech.RecognitionService"/>
              </intent>
              <intent>
                  <action android:name="android.intent.action.TTS_SERVICE"/>
              </intent>
              '''
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + intents, 1)
          else:
              s = s.replace('<application', '<queries>' + intents + '</queries>\n    <application', 1)
          s = s.replace('<application', perms + '<application', 1)
          recv = '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          s = s.replace('</application>', recv + '</application>', 1)
          p.write_text(s)

          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              f = pathlib.Path(name)
              if not f.exists():
                  continue
              g = f.read_text()
              if name.endswith('.kts'):
                  g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = maxOf(flutter.minSdkVersion, 24)')
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  g = g.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion Math.max(flutter.minSdkVersion, 24)')
                  g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              f.write_text(g)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: al-arqam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
