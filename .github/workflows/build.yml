name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.alarqam --project-name al_arqam --platforms=android .

      - name: Add adhan sound (optional)
        run: |
          if [ -f sounds/adhan.mp3 ]; then
            mkdir -p android/app/src/main/res/raw
            cp sounds/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          fi

      - name: Add location permissions
        run: |
          sed -i '/<manifest/a <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

      - name: Configure Android for notifications
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              '''
          s = s.replace('<application', perms + '<application', 1)
          recv = '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          s = s.replace('</application>', recv + '</application>', 1)
          p.write_text(s)

          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              f = pathlib.Path(name)
              if not f.exists():
                  continue
              g = f.read_text()
              if name.endswith('.kts'):
                  g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              f.write_text(g)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: al-arqam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
