name: al_arqam
description: "الأرقم - تطبيق العبادات اليومية (مواقيت الصلاة، الأذكار، المسبحة)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adhan: ^2.0.0
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  shared_preferences: ^2.3.2
  just_audio: ^0.9.40
  speech_to_text: ^7.1.0
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/fonts/OFL.txt
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
